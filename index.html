<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 5월 팀 일정표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .day-cell { min-height: 120px; transition: all 0.2s; }
        .day-cell:hover { background-color: #f1f5f9; }
        .event-badge { font-size: 0.7rem; padding: 2px 4px; border-radius: 4px; margin-bottom: 2px; }
        .team-a { background-color: #dbeafe; color: #1e40af; border-left: 3px solid #3b82f6; }
        .team-b { background-color: #fce7f3; color: #9d174d; border-left: 3px solid #ec4899; }
        .practice { background-color: #f1f5f9; color: #475569; border-left: 3px solid #94a3b8; }
        .gathering { background-color: #fef9c3; color: #854d0e; border-left: 3px solid #eab308; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-slate-900 p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">2026년 5월</h1>
                <p class="text-slate-400 text-sm">A팀 & B팀 통합 일정표</p>
            </div>
            <div class="flex flex-wrap gap-4 text-xs justify-end">
                <div class="flex items-center gap-1"><span class="w-3 h-3 bg-blue-500 rounded-full"></span> A팀 공연</div>
                <div class="flex items-center gap-1"><span class="w-3 h-3 bg-pink-500 rounded-full"></span> B팀 공연</div>
                <div class="flex items-center gap-1"><span class="w-3 h-3 bg-yellow-400 rounded-full"></span> 시간 안내</div>
            </div>
        </div>

        <!-- Days of Week -->
        <div class="calendar-grid bg-slate-50 border-b border-slate-200">
            <div class="p-3 text-center text-sm font-semibold text-rose-500">일</div>
            <div class="p-3 text-center text-sm font-semibold text-slate-600">월</div>
            <div class="p-3 text-center text-sm font-semibold text-slate-600">화</div>
            <div class="p-3 text-center text-sm font-semibold text-slate-600">수</div>
            <div class="p-3 text-center text-sm font-semibold text-slate-600">목</div>
            <div class="p-3 text-center text-sm font-semibold text-slate-600">금</div>
            <div class="p-3 text-center text-sm font-semibold text-blue-500">토</div>
        </div>

        <!-- Calendar Body -->
        <div id="calendar-body" class="calendar-grid">
            <!-- JS will inject days here -->
        </div>
    </div>

    <script>
        const events = {
            // 공연일
            perfA: [1, 9, 15, 23, 29],
            perfB: [2, 8, 16, 22, 30],
            // 특정 시간 안내 (모임 텍스트 제외)
            specialTimes: {
                1: "14:00",
                2: "13:00"
            }
        };

        const calendarBody = document.getElementById('calendar-body');
        
        // 2026년 5월 1일은 금요일 (요일 인덱스: 0=일, 5=금)
        const startDay = 5; 
        const daysInMonth = 31;

        // 이전 달 빈 칸 채우기
        for (let i = 0; i < startDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell bg-slate-50/50 border-r border-b border-slate-100';
            calendarBody.appendChild(emptyCell);
        }

        // 날짜 생성
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(2026, 4, day);
            const dayOfWeek = date.getDay();
            const cell = document.createElement('div');
            
            let dayColorClass = "text-slate-700";
            if (dayOfWeek === 0) dayColorClass = "text-rose-500";
            if (dayOfWeek === 6) dayColorClass = "text-blue-500";

            cell.className = `day-cell p-2 border-r border-b border-slate-100 flex flex-col gap-1`;
            
            let html = `<span class="font-bold text-sm ${dayColorClass}">${day}</span>`;
            
            // 1. 공연 일정
            if (events.perfA.includes(day)) {
                html += `<div class="event-badge team-a font-semibold">🎤 A팀 공연</div>`;
            }
            if (events.perfB.includes(day)) {
                html += `<div class="event-badge team-b font-semibold">🎤 B팀 공연</div>`;
            }

            // 2. 정기 연습 (수요일: B, 목요일: A)
            if (dayOfWeek === 3) {
                html += `<div class="event-badge practice text-[10px]">🏃 B팀 연습 (18:00)</div>`;
            }
            if (dayOfWeek === 4) {
                html += `<div class="event-badge practice text-[10px]">🏃 A팀 연습 (18:00)</div>`;
            }

            // 3. 시간 안내 (노란색 배지에서 '모임' 텍스트 제거)
            if (events.specialTimes[day]) {
                html += `<div class="event-badge gathering text-[10px] font-medium text-center">📍 ${events.specialTimes[day]}</div>`;
            } else {
                // 매주 토요일 13:00
                if (dayOfWeek === 6) {
                    html += `<div class="event-badge gathering text-[10px] font-medium text-center">📍 13:00</div>`;
                }
                // 금요일(1일 제외) 18:00
                if (dayOfWeek === 5 && day !== 1) {
                    html += `<div class="event-badge gathering text-[10px] font-medium text-center">📍 18:00</div>`;
                }
            }

            cell.innerHTML = html;
            calendarBody.appendChild(cell);
        }

        // 마지막 줄 빈 칸 채우기
        const totalCells = startDay + daysInMonth;
        const extraCells = (7 - (totalCells % 7)) % 7;
        for (let i = 0; i < extraCells; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell bg-slate-50/50 border-r border-b border-slate-100';
            calendarBody.appendChild(emptyCell);
        }
    </script>
</body>
</html>
